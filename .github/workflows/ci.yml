name: Frontend CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

# Cancela ejecuciones anteriores de la misma rama/PR cuando llega un nuevo push.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Instalación, pruebas y compilación
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Angular 22 requiere Node ^22.22.3, ^24.15.0 o >=26.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Run unit tests with coverage
        run: npm test -- --watch=false

      - name: Coverage summary
        if: always()
        run: |
          summary=coverage/biogestor-frontend/coverage-summary.json
          {
            echo '### Cobertura (mínimo 70 %)'
            if [ -f "$summary" ]; then
              echo '| Métrica | Cubierto | Total | % | Estado |'
              echo '| --- | --- | --- | --- | --- |'
              jq -r '.total | to_entries[] | select(.key != "branchesTrue") | "| \(.key) | \(.value.covered) | \(.value.total) | \(.value.pct) | \(if .value.pct >= 70 then "✅" else "❌" end) |"' "$summary"
            else
              echo 'No se generó el reporte de cobertura.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biogestor-frontend-coverage
          path: coverage/biogestor-frontend
          retention-days: 7
          if-no-files-found: ignore

      - name: Build (production)
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: biogestor-frontend-dist
          path: dist/biogestor-frontend
          retention-days: 7
