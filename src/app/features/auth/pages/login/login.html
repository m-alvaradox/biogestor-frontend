
<div class="login-page">
  <div class="background-circle" aria-hidden="true"></div>

  <main class="login-card">
    <header class="login-header">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">
          <img src="/icons/database.svg" alt="" />
        </span>

        <span class="brand-name">
          Bio<span>Gestor</span>
        </span>
      </div>

      <h1>Iniciar sesión</h1>
    </header>

    <form
      class="login-form"
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      novalidate
    >
      <div class="form-field">

        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path
              d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"
              stroke="currentColor"
              stroke-width="1.8"
              stroke-linecap="round"
            />
            <circle
              cx="12"
              cy="7"
              r="4"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>

          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Usuario"
            autocomplete="username"
            [attr.aria-invalid]="submitted() && loginForm.controls.username.invalid"
            [attr.aria-describedby]="submitted() && loginForm.controls.username.invalid ? 'username-error' : null"
          />
        </div>

        @if (submitted() && loginForm.controls.username.invalid) {
          <small id="username-error" class="field-error">
            El usuario es obligatorio.
          </small>
        }
      </div>

      <div class="form-field">

        <div class="input-wrapper">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <rect
              x="5"
              y="10"
              width="14"
              height="11"
              rx="2"
              stroke="currentColor"
              stroke-width="1.8"
            />
            <path
              d="M8 10V7a4 4 0 0 1 8 0v3"
              stroke="currentColor"
              stroke-width="1.8"
            />
          </svg>

          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            [attr.aria-invalid]="submitted() && loginForm.controls.password.invalid"
            [attr.aria-describedby]="submitted() && loginForm.controls.password.invalid ? 'password-error' : null"
          />

          <button
            class="toggle-password"
            type="button"
            (click)="togglePassword()"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            [attr.aria-pressed]="showPassword()"
          >
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"
                  stroke="currentColor"
                  stroke-width="1.8"
                />
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path
                  d="M3 3l18 18M10.6 6.1A11 11 0 0 1 12 6c6.5 0 10 6 10 6a15 15 0 0 1-3.1 3.5M6.1 6.1C3.5 7.7 2 12 2 12s3.5 6 10 6c1.4 0 2.7-.3 3.8-.8"
                  stroke="currentColor"
                  stroke-width="1.8"
                  stroke-linecap="round"
                />
              </svg>
            }
          </button>
        </div>

        @if (submitted() && loginForm.controls.password.invalid) {
          <small id="password-error" class="field-error">
            La contraseña es obligatoria.
          </small>
        }
      </div>

      <button class="submit-button" type="submit">
        Ingresar
      </button>
    </form>

    <footer class="login-footer">
      <p>Powered by</p>
      <span>BIODYNAMICS</span>
    </footer>
  </main>
</div>
